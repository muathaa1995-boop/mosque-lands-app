workflows:
  ios-workflow:
    name: iOS Build Test
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Capacitor web assets
        script: |
          npx cap sync ios
      - name: Build iOS app (simulator, no signing)
        script: |
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO