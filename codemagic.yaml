workflows:
  ios-workflow:
    name: iOS Build and Publish
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic CI Admin
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.muath.mosquelands
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        APP_STORE_APPLE_ID: 6813134062
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Capacitor web assets
        script: |
          npx cap sync ios
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          #!/usr/bin/env bash
          set -e
          cd $(dirname "$XCODE_PROJECT")
          agvtool new-version -all $(date +%s)
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
